<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 640" role="img">
<title>Where the M1 reference model is used in R1 to R7</title>
<desc>The target system runs from the PL signal chain through the DMA ring and the UDP sender on the ZUBoard to gr-difi on LNXPC. Four kinds of test tap into it: cocotb benches on the RTL, difi-uio captures of the DMA ring, captures on the HIL NIC, and receiver checks in gr-difi. Each tap uses the difi_ref reference model built in M1, which later releases extend with a bit-true DDC model, context math and retune timing.</desc>

<style>
  text { font-family: "anthropic-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: rgba(11,11,11,0.25); stroke-width: 0.75; }
  .dash { stroke-dasharray: 4 4; }
  .flabel { font-size: 12px; fill: #52514e; }
  .flabel-b { font-size: 12px; font-weight: 600; fill: #3d3d3a; }
  .t { font-size: 14px; font-weight: 500; }
  .s { font-size: 12px; }
  .xs { font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .note { font-size: 11px; fill: #52514e; }
  .purple { fill: #eeedfe; stroke: #534ab7; stroke-width: 0.75; }
  .purple-t { fill: #3c3489; } .purple-s { fill: #534ab7; }
  .coral { fill: #faece7; stroke: #993c1d; stroke-width: 0.75; }
  .coral-t { fill: #712b13; } .coral-s { fill: #993c1d; }
  .teal { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 0.75; }
  .teal-t { fill: #085041; } .teal-s { fill: #0f6e56; }
  .gray { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.75; }
  .gray-t { fill: #444441; } .gray-s { fill: #5f5e5a; }
  .later { fill: none; stroke: #534ab7; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .badge-purple { fill: #534ab7; } .badge-coral { fill: #993c1d; } .badge-teal { fill: #0f6e56; } .badge-gray { fill: #5f5e5a; }
  .badge-txt { font-size: 10px; font-weight: 700; fill: #ffffff; }
  .flow { fill: none; stroke: #898781; stroke-width: 1.25; }
  .ctl { fill: none; stroke: #993c1d; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .chk { fill: none; stroke: #0f6e56; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .lbl { font-size: 11px; fill: #52514e; }
  .mk-flow { stroke: #898781; } .mk-ctl { stroke: #993c1d; } .mk-chk { stroke: #0f6e56; }
  @media (prefers-color-scheme: dark) {
    text { fill: #ecebe6; }
    .bg { fill: #1f1e1c; }
    .frame { stroke: rgba(236,235,230,0.3); }
    .flabel, .note, .lbl { fill: #b5b3ab; }
    .flabel-b { fill: #d6d4cc; }
    .purple { fill: #2c2a4f; stroke: #a49cf0; } .purple-t { fill: #d9d5ff; } .purple-s { fill: #b9b2f5; }
    .coral { fill: #4a2416; stroke: #ec9a78; } .coral-t { fill: #ffd9c9; } .coral-s { fill: #f2ad90; }
    .teal { fill: #123a30; stroke: #5fc9a6; } .teal-t { fill: #c9f2e3; } .teal-s { fill: #8adcc0; }
    .gray { fill: #34332f; stroke: #a8a69e; } .gray-t { fill: #e4e2da; } .gray-s { fill: #c2c0b8; }
    .later { stroke: #a49cf0; }
    .badge-purple { fill: #7a70e0; } .badge-coral { fill: #c4603a; } .badge-teal { fill: #2a9a7a; } .badge-gray { fill: #8a8882; }
    .flow { stroke: #a8a69e; }
    .ctl { stroke: #ec9a78; }
    .chk { stroke: #5fc9a6; }
    .mk-flow { stroke: #a8a69e; } .mk-ctl { stroke: #ec9a78; } .mk-chk { stroke: #5fc9a6; }
  }
</style>
