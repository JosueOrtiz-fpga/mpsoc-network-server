<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 688" role="img">
<title>M1 reference model and receiver pre-check</title>
<desc>On LNXPC, the difi_ref package (Python standard library only) holds field codecs, a register set with shadow-to-active commits, sample sources, a timebase and a reference packetizer. Packets go to a stream checker and to capture I/O, and every packet is checked by DIFI-Certification's Construct validate(). The three reference captures are parsed through capture I/O and checked in lenient mode. A receiver pre-check replays generated packets over UDP into gr-difi and a headless GNU Radio flowgraph, and runs certify_source.py on a generated pcap.</desc>

