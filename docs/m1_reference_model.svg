    .flow { stroke: #a8a69e; }
    .ctl { stroke: #ec9a78; }
    .chk { stroke: #5fc9a6; }
    .mk-flow { stroke: #a8a69e; } .mk-ctl { stroke: #ec9a78; } .mk-chk { stroke: #5fc9a6; }
