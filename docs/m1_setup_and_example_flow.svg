<rect class="frame" x="12" y="12" width="856" height="232" rx="12"/>
<text class="flabel-b" x="26" y="30" dominant-baseline="central">1 · M1 setup, all on LNXPC</text>
<rect class="gray" x="28" y="64" width="112" height="140" rx="8"/>
<text class="t gray-t" x="84.0" y="88" text-anchor="middle" dominant-baseline="central">pytest</text>
<text class="s gray-s" x="84.0" y="107" text-anchor="middle" dominant-baseline="central">make ref-rx-check</text>
<text class="s gray-s" x="84.0" y="124" text-anchor="middle" dominant-baseline="central"></text>
<text class="s gray-s" x="84.0" y="141" text-anchor="middle" dominant-baseline="central">drives the model,</text>
<text class="s gray-s" x="84.0" y="158" text-anchor="middle" dominant-baseline="central">asserts results</text>
