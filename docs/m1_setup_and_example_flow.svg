<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 1180" role="img">
<title>M1 setup and an example data and control flow</title>
<desc>Panel 1: on LNXPC, a pytest run drives the difi_ref model through its registers; the model's packets go to a stream checker with validate() and through a UDP replay tool into a GNU Radio flowgraph with the gr-difi DIFI Source, whose tags and FFT result go back to the test. Panel 2: a sequence diagram of one run. The test writes the shadow registers, commits, seeds the timebase and enables the stream; the packetizer emits a context packet with the change indicator and then data packets every 1.875 ms; the replay tool sends them to gr-difi, which reports a context tag and a tone. A retune commit while running produces a context packet with the change indicator at the next packet boundary, sharing the timestamp of the following data packet, and gr-difi reports the new frequency.</desc>

