<text class="t purple-t" x="672.0" y="318" text-anchor="middle" dominant-baseline="central">UDP replay</text>
<line class="life" x1="800" y1="338" x2="800" y2="1032"/>
<rect class="gray" x="746.0" y="298" width="108" height="40" rx="8"/>
<text class="t gray-t" x="800.0" y="318" text-anchor="middle" dominant-baseline="central">gr-difi</text>
<rect class="teal" x="549" y="632" width="10" height="392" rx="2"/>
<rect class="phase" x="24" y="353" width="832" height="22" rx="4"/>
<text class="flabel-b" x="36" y="364" text-anchor="start" dominant-baseline="central">Configure  ·  ENABLE = 0</text>
<path class="ctl" d="M82 396 H194" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="141.0" y="387" text-anchor="middle" dominant-baseline="central">write shadow</text>
<circle class="badge-gray" cx="32" cy="396" r="9"/>
<text class="badge-txt" x="32" y="396.5" text-anchor="middle" dominant-baseline="central">1</text>
<text class="note halo" x="214" y="396.5" text-anchor="start" dominant-baseline="central">SRC_SEL = 1 (tone) · DDC_DECIM = 640 · SAMPLES_PER_PKT = 360 · CTX_INTERVAL = 533</text>
<text class="note halo" x="214" y="412" text-anchor="start" dominant-baseline="central">CTX_SAMPLE_RATE = 192 kHz · CTX_RF_REF_FREQ = 7.1 MHz</text>
<path class="ctl" d="M82 442 H194" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="141.0" y="433" text-anchor="middle" dominant-baseline="central">COMMIT</text>
<circle class="badge-gray" cx="32" cy="442" r="9"/>
<text class="badge-txt" x="32" y="442.5" text-anchor="middle" dominant-baseline="central">2</text>
<text class="note halo" x="214" y="442.5" text-anchor="start" dominant-baseline="central">validated (codes 0x01–0x08), applied at once while disabled; COMMIT_STATUS.SEQ = 1</text>
<path class="ctl" d="M82 476 H312" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="200.0" y="467" text-anchor="middle" dominant-baseline="central">TB_SEED_SEC, LOAD_NOW</text>
<circle class="badge-gray" cx="32" cy="476" r="9"/>
<text class="badge-txt" x="32" y="476.5" text-anchor="middle" dominant-baseline="central">3</text>
<text class="note halo" x="332" y="476.5" text-anchor="start" dominant-baseline="central">seeded from the host clock, POSIX seconds</text>
<rect class="phase" x="24" y="499" width="832" height="22" rx="4"/>
<text class="flabel-b" x="36" y="510" text-anchor="start" dominant-baseline="central">Start streaming</text>
<path class="ctl" d="M82 542 H194" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="141.0" y="533" text-anchor="middle" dominant-baseline="central">CTRL.ENABLE = 1</text>
<circle class="badge-gray" cx="32" cy="542" r="9"/>
<text class="badge-txt" x="32" y="542.5" text-anchor="middle" dominant-baseline="central">4</text>
<path class="ctl" d="M200 576 H430" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="318.0" y="567" text-anchor="middle" dominant-baseline="central">active set</text>
<circle class="badge-gray" cx="32" cy="576" r="9"/>
<text class="badge-txt" x="32" y="576.5" text-anchor="middle" dominant-baseline="central">5</text>
<path class="flow" d="M318 610 H430" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="377.0" y="601" text-anchor="middle" dominant-baseline="central">samples, time</text>
<circle class="badge-gray" cx="32" cy="610" r="9"/>
<text class="badge-txt" x="32" y="610.5" text-anchor="middle" dominant-baseline="central">6</text>
<text class="note halo" x="304" y="610.5" text-anchor="end" dominant-baseline="central">tone at 192 kS/s, Q32.32 ps</text>
<path class="flow" d="M436 644 H666" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="554.0" y="635" text-anchor="middle" dominant-baseline="central">context · CIF0 0xFBB98000 · ts T₀</text>
<circle class="dot-chk" cx="554" cy="644" r="3.5"/>
<circle class="badge-gray" cx="32" cy="644" r="9"/>
<text class="badge-txt" x="32" y="644.5" text-anchor="middle" dominant-baseline="central">7</text>
<path class="flow" d="M436 678 H666" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="554.0" y="669" text-anchor="middle" dominant-baseline="central">data #0, #1, … · ts T₀ + n × 1.875 ms</text>
<circle class="dot-chk" cx="554" cy="678" r="3.5"/>
<circle class="badge-gray" cx="32" cy="678" r="9"/>
<text class="badge-txt" x="32" y="678.5" text-anchor="middle" dominant-baseline="central">8</text>
<path class="flow" d="M672 712 H794" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="736.0" y="703" text-anchor="middle" dominant-baseline="central">UDP, paced by ts</text>
<circle class="badge-gray" cx="32" cy="712" r="9"/>
<text class="badge-txt" x="32" y="712.5" text-anchor="middle" dominant-baseline="central">9</text>
<path class="chk" d="M800 746 H88" marker-end="url(#arrow-chk)"/>
<text class="lbl halo" x="441.0" y="737" text-anchor="middle" dominant-baseline="central">context tag: 192 kS/s, 7.1 MHz · no gap tags after the first · FFT peak at the tone</text>
<circle class="badge-gray" cx="32" cy="746" r="9"/>
<text class="badge-txt" x="32" y="746.5" text-anchor="middle" dominant-baseline="central">10</text>
<rect class="phase" x="24" y="769" width="832" height="22" rx="4"/>
<text class="flabel-b" x="36" y="780" text-anchor="start" dominant-baseline="central">Retune  ·  the pre-check's second run, commit while enabled</text>
<path class="ctl" d="M82 812 H194" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="141.0" y="803" text-anchor="middle" dominant-baseline="central">COMMIT</text>
<circle class="badge-gray" cx="32" cy="812" r="9"/>
<text class="badge-txt" x="32" y="812.5" text-anchor="middle" dominant-baseline="central">11</text>
<text class="note halo" x="214" y="812.5" text-anchor="start" dominant-baseline="central">DDC_PHASE_INC and CTX_RF_REF_FREQ = 14.2 MHz in one commit</text>
<path class="ctl" d="M200 846 H430" marker-end="url(#arrow-ctl)"/>
<text class="lbl halo" x="318.0" y="837" text-anchor="middle" dominant-baseline="central">applied at packet boundary k</text>
<circle class="badge-gray" cx="32" cy="846" r="9"/>
<text class="badge-txt" x="32" y="846.5" text-anchor="middle" dominant-baseline="central">12</text>
<path class="flow" d="M436 880 H666" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="554.0" y="871" text-anchor="middle" dominant-baseline="central">context · change indicator · ts Tₖ</text>
<circle class="dot-chk" cx="554" cy="880" r="3.5"/>
<circle class="badge-gray" cx="32" cy="880" r="9"/>
<text class="badge-txt" x="32" y="880.5" text-anchor="middle" dominant-baseline="central">13</text>
<path class="flow" d="M436 914 H666" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="554.0" y="905" text-anchor="middle" dominant-baseline="central">data k, k + 1, … · ts Tₖ, …</text>
<circle class="dot-chk" cx="554" cy="914" r="3.5"/>
<circle class="badge-gray" cx="32" cy="914" r="9"/>
<text class="badge-txt" x="32" y="914.5" text-anchor="middle" dominant-baseline="central">14</text>
<path class="flow" d="M672 948 H794" marker-end="url(#arrow-flow)"/>
<text class="lbl halo" x="736.0" y="939" text-anchor="middle" dominant-baseline="central">UDP</text>
<circle class="badge-gray" cx="32" cy="948" r="9"/>
<text class="badge-txt" x="32" y="948.5" text-anchor="middle" dominant-baseline="central">15</text>
<path class="chk" d="M800 982 H88" marker-end="url(#arrow-chk)"/>
<text class="lbl halo" x="441.0" y="973" text-anchor="middle" dominant-baseline="central">new context tag: 14.2 MHz · still no gap tags</text>
<circle class="badge-gray" cx="32" cy="982" r="9"/>
<text class="badge-txt" x="32" y="982.5" text-anchor="middle" dominant-baseline="central">16</text>
<path class="chk" d="M554 1016 H88" marker-end="url(#arrow-chk)"/>
<text class="lbl halo" x="318.0" y="1007" text-anchor="middle" dominant-baseline="central">every packet passed the stream rules and validate()</text>
<circle class="badge-gray" cx="32" cy="1016" r="9"/>
<text class="badge-txt" x="32" y="1016.5" text-anchor="middle" dominant-baseline="central">17</text>
<rect class="teal" x="24" y="1046" width="832" height="58" rx="8"/>
<text class="s teal-t" x="40" y="1064" text-anchor="start" dominant-baseline="central">Checker rules on this run</text>
<text class="xs teal-s" x="40" y="1084" text-anchor="start" dominant-baseline="central">context first · change indicator only at start and commit · context ts = next data ts · counts continuous (4-bit, separate per type)</text>
<text class="xs teal-s" x="40" y="1098" text-anchor="start" dominant-baseline="central">data ts step = 360 samples × 640 × 8.138 ns = 1.875 ms, within 1 ps · context fields match the committed registers · ≤ 20 context packets/s</text>
<path class="ctl" d="M24 1150 h28" marker-end="url(#arrow-ctl)"/>
<text class="note" x="60" y="1150" text-anchor="start" dominant-baseline="central">control: register writes, commits</text>
<path class="flow" d="M274 1150 h28" marker-end="url(#arrow-flow)"/>
<text class="note" x="310" y="1150" text-anchor="start" dominant-baseline="central">data: samples, packets, UDP</text>
<path class="chk" d="M494 1150 h28" marker-end="url(#arrow-chk)"/>
<text class="note" x="530" y="1150" text-anchor="start" dominant-baseline="central">results back to the test</text>
<circle class="dot-chk" cx="704" cy="1150" r="3.5"/>
<text class="note" x="714" y="1150" text-anchor="start" dominant-baseline="central">also seen by the checker</text>
</svg>
