<text class="lbl" x="766.0" y="216" text-anchor="end" dominant-baseline="central">context tags, gap tags, FFT peak</text>
<rect class="frame" x="12" y="262" width="856" height="858" rx="12"/>
<text class="flabel-b" x="26" y="280" dominant-baseline="central">2 · Example run: a 192 kS/s tone stream, then a retune</text>
<line class="life" x1="82" y1="338" x2="82" y2="1032"/>
<rect class="gray" x="28.0" y="298" width="108" height="40" rx="8"/>
<text class="t gray-t" x="82.0" y="318" text-anchor="middle" dominant-baseline="central">pytest</text>
