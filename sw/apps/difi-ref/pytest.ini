# difi-ref tests: make ref-test runs this directory, make ref-rx-check its rx tests.
[pytest]
testpaths = tests
# No .pytest_cache in the source tree; summary of skips and failures at the end.
addopts = -p no:cacheprovider -ra
# The rx tests need GNU Radio and gr-difi; --rx (make ref-rx-check) runs them, and only them.
markers =
    rx: receiver pre-check through gr-difi (run with --rx: make ref-rx-check)
# GNU Radio 3.10.1's top_block still calls Thread.setDaemon().
filterwarnings =
    ignore:setDaemon\(\) is deprecated:DeprecationWarning
