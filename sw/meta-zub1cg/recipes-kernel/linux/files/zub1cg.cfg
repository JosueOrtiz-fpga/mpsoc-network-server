# ZUBoard 1CG kernel config fragment.
# Built in, not modules: with NFS root (HIL bench) the network must be up
# before any rootfs exists, and the KSZ9131 PHY driver is what applies the
# RGMII internal delays that phy-mode "rgmii-id" asks for.
CONFIG_MACB=y
CONFIG_MICREL_PHY=y
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y
CONFIG_NFS_FS=y
CONFIG_ROOT_NFS=y
# AT24MAC602 on I2C1 (EEPROM + EUI page)
CONFIG_EEPROM_AT24=y
