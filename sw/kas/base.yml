# sw/kas/base.yml - layer set for AMD EDF 25.11 (Vivado/EDF 2025.2, Yocto 5.0 "scarthgap")
#
# Mirrors Xilinx/yocto-manifests default-edf.xml @ rel-v2025.2, keeping only the
# layers this project needs (no ROS, Qt, Jupyter, Kria, Zephyr, ...).
#
# Always first in a chain:  kas build sw/kas/base.yml:sw/kas/bootbin.yml
#                           kas build sw/kas/base.yml:sw/kas/image.yml
# Pinning: `make sw-lock` writes base.lock.yml next to this file; commit it.
# kas then applies it automatically, so every build is reproducible from a git hash.
#
# The branch below must match EDF_RELEASE in versions.env (make check-versions).

header:
  version: 14

distro: amd-edf
machine: amd-cortexa53-common     # overridden by bootbin.yml

defaults:
  repos:
    branch: rel-v2025.2

repos:
  # This repository.
  zub1cg-project:
    layers:
      sw/meta-zub1cg:
      platform/machine:          # generated machine conf (make platform)

  poky:
    url: https://github.com/Xilinx/poky.git
    path: layers/poky
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/Xilinx/meta-openembedded.git
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-perl:

  meta-arm:
    url: https://github.com/Xilinx/meta-arm.git
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-security:
    url: https://github.com/Xilinx/meta-security.git
    path: layers/meta-security
    layers:
      meta-tpm:

  meta-virtualization:
    url: https://github.com/Xilinx/meta-virtualization.git
    path: layers/meta-virtualization

  meta-openamp:                  # required by meta-xilinx-standalone-sdt
    url: https://github.com/Xilinx/meta-openamp.git
    path: layers/meta-openamp

  meta-xilinx:
    url: https://github.com/Xilinx/meta-xilinx.git
    path: layers/meta-xilinx
    layers:
      meta-xilinx-core:
      meta-xilinx-standalone:
      meta-xilinx-standalone-sdt:  # FSBL/PMUFW from the system device tree
      meta-microblaze:             # PMU is a MicroBlaze

  meta-amd-adaptive-socs:
    url: https://github.com/Xilinx/meta-amd-adaptive-socs.git
    path: layers/meta-amd-adaptive-socs
    layers:
      meta-amd-adaptive-socs-core:
      meta-amd-adaptive-socs-bsp:

  meta-amd-edf:                  # EDF distro + edf-linux-disk-image
    url: https://github.com/Xilinx/meta-amd-edf.git
    path: layers/meta-amd-edf

local_conf_header:
  00-base: |
    CONF_VERSION = "2"
    # Keep work dirs small on the runner; logs are kept.
    INHERIT += "rm_work"
