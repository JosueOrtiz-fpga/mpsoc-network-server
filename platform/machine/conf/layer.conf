# platform/machine - generated Yocto machine for the ZUBoard 1CG (hand-written file)
#
# Everything else in this conf/ directory is written by `make platform`
# (sw/scripts/gen-machine.sh) from platform/sdt. Do not edit it by hand:
# change the XSA or sw/meta-zub1cg/board-dts/zub1cg-board.dtsi and regenerate.

BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "zub1cg-platform"
BBFILE_PATTERN_zub1cg-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_zub1cg-platform = "10"
LAYERDEPENDS_zub1cg-platform = "core"
LAYERSERIES_COMPAT_zub1cg-platform = "scarthgap"

# Anchors for the relocated paths in the generated files. ':=' because LAYERDIR
# is only valid while this file is parsed.
ZUB1CG_MACHINE_LAYER := "${LAYERDIR}"
ZUB1CG_SDT_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', 'sdt'))}"
