# HIL suite: `make hil` stages the build and runs this directory.
[pytest]
testpaths = .
# No .pytest_cache in the source tree; summary of skips and failures at the end.
addopts = -p no:cacheprovider -ra
# xunit1 keeps record_property values (board temperature) in junit.xml; xunit2 drops them.
junit_family = xunit1
